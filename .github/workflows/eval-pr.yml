# Agent-side evaluation harness. Lives on a fork only; never proposed upstream.
# Decides behavioural questions the upstream diff cannot: build main and every named PR head,
# then run one shared fixture battery against all of them.
name: eval-pr

on:
  push:
    branches: [ci-eval]
  workflow_dispatch:
    inputs:
      pr:
        description: 'space separated PR numbers (blank = baseline only)'
        required: false
        default: ''

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned toolchains
        run: |
          set -e
          curl -sSL -o /tmp/go.tgz https://go.dev/dl/go1.26.9.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          echo "/usr/local/go/bin:$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve targets
        id: target
        run: |
          N="${PR_TARGET}"
          if [ -z "$N" ] && [ -f .ci-pr ]; then N="$(tr '\n' ' ' < .ci-pr)"; fi
          echo "prs=$N" >> "$GITHUB_OUTPUT"
          echo "evaluating: ${N:-baseline only}"
        env:
          PR_TARGET: ${{ github.event.inputs.pr }}

      - name: Stash harness assets
        run: |
          # The fixture set lives only on this branch; checking out a PR head would remove it.
          rm -rf /tmp/ci-assets
          cp -r ci /tmp/ci-assets
          ls /tmp/ci-assets/fixtures/425 | wc -l

      - name: Build main and run battery
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          git log -1 --format='MAIN %h %ci %s'
          ( cd compiler && cargo build -p hyb --quiet )
          cp compiler/target/debug/hyb /tmp/hyb-main
          bash /tmp/ci-assets/battery.sh /tmp/hyb-main main /tmp/ci-assets/fixtures/425
          echo "== race-scan on main =="
          bash /tmp/ci-assets/race-scan.sh /tmp/hyb-main
          echo "== soundness variants: verdict =="
          bash /tmp/ci-assets/battery.sh /tmp/hyb-main sound /tmp/ci-assets/fixtures/sound
          echo "== soundness variants: race =="
          bash /tmp/ci-assets/race-scan.sh /tmp/hyb-main /tmp/ci-assets/fixtures/sound
          echo "== issue 429 reproducers: verdict =="
          bash /tmp/ci-assets/battery.sh /tmp/hyb-main i429 /tmp/ci-assets/fixtures/429
          echo "== issue 429 reproducers: run =="
          bash /tmp/ci-assets/race-scan.sh /tmp/hyb-main /tmp/ci-assets/fixtures/429

      - name: Build each PR head and run battery
        if: steps.target.outputs.prs != ''
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          UP=https://github.com/limitlessprojects/Go-Hybrid.git
          for N in ${{ steps.target.outputs.prs }}; do
            echo "###### PR $N"
            git fetch --no-tags "$UP" "+refs/pull/${N}/head:prhead-${N}" "main:upmain" >/dev/null 2>&1
            git checkout -q "prhead-${N}"
            git log -1 --format="PR${N} %h %ci %s"
            git diff --stat "upmain"..."prhead-${N}" | tail -12
            ( cd compiler && cargo build -p hyb --quiet )
            cp compiler/target/debug/hyb "/tmp/hyb-${N}"
            bash /tmp/ci-assets/battery.sh "/tmp/hyb-${N}" "pr${N}" /tmp/ci-assets/fixtures/425
            echo "== 429 verdict for pr${N} =="
            bash /tmp/ci-assets/battery.sh "/tmp/hyb-${N}" "pr${N}-i429" /tmp/ci-assets/fixtures/429
            echo "== 429 run for pr${N} =="
            bash /tmp/ci-assets/race-scan.sh "/tmp/hyb-${N}" /tmp/ci-assets/fixtures/429
            echo "== corpus regression for pr${N} =="
            python3 tools/corpus_harness.py --bin "/tmp/hyb-${N}" 2>&1 | tail -10
          done
